<style>
/* Layout: one letterboxed 9:16 arcade cabinet screen, CRT glass on top, thumb buttons inside the glass. */
:root{
  --void:#05040c;      /* space between the stars */
  --phosphor:#f8f8f8;  /* text */
  --marquee:#f8d840;   /* crawl yellow, Farce button */
  --alarm:#e8283c;     /* 1UP red */
  --chrome:#d8e0ee;    /* steam iron chrome */
  --bezel:#16142a;
  --pixel:"Press Start 2P", "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--void);color:var(--phosphor);overflow:hidden;overscroll-behavior:none}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;
  background:radial-gradient(ellipse at center,var(--bezel) 0%,var(--void) 70%)}
#wrap{position:relative;max-width:100%;box-shadow:0 0 0 2px #2a2648,0 0 40px rgba(248,216,64,.08)}
#game{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#wrap::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0,rgba(0,0,0,0) 2px,rgba(0,0,0,.22) 3px),
    radial-gradient(ellipse at center,rgba(0,0,0,0) 60%,rgba(0,0,0,.55) 100%);}
.btn[hidden]{display:none!important}
.btn{position:absolute;z-index:2;font-family:var(--pixel);color:var(--phosphor);background:rgba(10,10,30,.55);
  border:2px solid var(--chrome);border-radius:6px;padding:0;cursor:pointer;touch-action:none}
.btn:focus-visible{outline:2px solid var(--marquee);outline-offset:2px}
#bomb{right:4%;bottom:3%;width:21%;aspect-ratio:1;border-radius:50%;border:3px solid var(--marquee);color:var(--marquee);
  font-size:clamp(7px,2.2vh,11px);line-height:1.6;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 40% 35%,rgba(248,216,64,.28),rgba(20,16,4,.6))}
#bomb:active{transform:scale(.94)}
#bomb b{font-size:1.5em;font-weight:400}
#pause{right:3%;top:2.2%;width:9%;aspect-ratio:1;font-size:clamp(7px,1.8vh,10px)}
#mute{right:14%;top:2.2%;width:9%;aspect-ratio:1;font-size:clamp(7px,1.8vh,10px)}
#mute[aria-pressed="true"]{color:#6a6a80;border-color:#6a6a80;text-decoration:line-through}
@media (prefers-reduced-motion: reduce){#bomb:active{transform:none}}
</style>
</head>

    <button id="pause" class="btn" type="button" aria-label="Pause" hidden>II</button>
    <button id="bomb" class="btn" type="button" aria-label="Use the Farce" hidden><span>FARCE</span><b id="bombN">2</b></button>

    ctx.globalAlpha = 0.65 + Math.sin(T * 30) * 0.15; drawSpr(spr, W / 2, 112 + bob, sc); ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(110,228,250,0.18)'; for (let y = 70; y < 160; y += 3) ctx.fillRect(W / 2 - 40, y, 80, 1);
  } else drawSpr(spr, W / 2, 112 + bob, sc);
}
function drawTalk() {
  drawBg(stg ? stg.n : 0);
  drawPortraitBig(talk.who);
  const c = CHAR[talk.who], bx = 6, by = H - 122, bw = W - 12, bh = 114;
  ctx.fillStyle = 'rgba(5,4,20,0.94)'; ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = '#f8d840'; ctx.lineWidth = 2; ctx.strokeRect(bx + 1, by + 1, bw - 2, bh - 2);
  ctx.strokeStyle = '#7c1426'; ctx.lineWidth = 1; ctx.strokeRect(bx + 4.5, by + 4.5, bw - 9, bh - 9);
  ctx.fillStyle = '#16142a'; ctx.fillRect(bx + 8, by + 8, 32, 32);
  const s = SPR[c.spr]; ctx.drawImage(s, bx + 8, by + 8, 32, 32);
  wrapText(c.name, 16).forEach((l, i) => txt(l, bx + 46, by + 12 + i * 11, c.col));
  let left = Math.floor(talk.shown);
  talk.lines.forEach((l, i) => { if (left <= 0) return; txt(l.slice(0, left), bx + 8, by + 46 + i * 11, '#f8f8f8'); left -= l.length + 1; });
  if (talk.shown >= talk.text.length && (T * 3 | 0) % 2) txt('>', bx + bw - 14, by + bh - 14, '#f8d840');
}
function drawOver() {
  drawPlay();
  ctx.fillStyle = 'rgba(5,4,12,0.78)'; ctx.fillRect(0, 0, W, H);
  txt('GAME OVER', W / 2, 96, '#e8283c', 'center', 16);
  txt('INSERT THREE BUCKS', W / 2, 140, '#f8f8f8', 'center');
  txt('TO CONTINUE', W / 2, 152, '#f8f8f8', 'center');
  txt(String(Math.max(0, Math.ceil(overT - 1))), W / 2, 178, '#f8d840', 'center', 32);
  if ((T * 2 | 0) % 2) txt('TAP TO CONTINUE', W / 2, 232, '#f8d840', 'center');
  txt('SCORE ' + pad(score), W / 2, 256, '#8a93ab', 'center');
}
function drawWin() {
  drawBg(0);
  txt('THE END', W / 2, 40, '#f8d840', 'center', 24);
  txt('OR IS IT?', W / 2, 76, '#f8f8f8', 'center');
  txt('(IT IS.)', W / 2, 88, '#8a93ab', 'center');
  drawSpr('anne', W / 2, 130, 3);
  ['fluke', 'ham', 'chew'].forEach((k, i) => drawSpr(k, 48 + i * 48, 182 + Math.sin(T * 4 + i) * 2, 2));
  ['augie', 'q2', 'artie'].forEach((k, i) => drawSpr(k, 48 + i * 48, 222 + Math.sin(T * 4 + i + 1) * 2, 2));
  txt('SCORE ' + pad(score), W / 2, 252, '#f8f8f8', 'center');
  txt('HI    ' + pad(hi), W / 2, 264, '#e8283c', 'center');
  if ((T * 2 | 0) % 2) txt('TAP TO PLAY AGAIN', W / 2, 296, '#f8d840', 'center');
  txt('MAY THE FARCE BE', W / 2, 316, '#4a5068', 'center');
  txt('WITH YOU', W / 2, 328, '#4a5068', 'center');
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (S === 'title' || S === 'coin') drawTitle();
  else if (S === 'crawl') drawCrawl();
  else if (S === 'talk') drawTalk();
  else if (S === 'play') drawPlay();
  else if (S === 'over') drawOver();
  else if (S === 'win') drawWin();
  const inPlay = S === 'play';
  if (bombBtn.hidden === inPlay) bombBtn.hidden = !inPlay;
  if (pauseBtn.hidden === inPlay) pauseBtn.hidden = !inPlay;
  if (P && bombN.textContent !== String(P.bombs)) bombN.textContent = String(P.bombs);
}

// ------------------------------------------------------------------ input
function tap() {
  if (S === 'coin') { credits = 1; S = 'title'; unlockAudio(); sfx('coin'); playMusic('title'); }
  else if (S === 'title') { credits = Math.max(credits, 1); newGame(); }
  else if (S === 'crawl') nextStep();
  else if (S === 'talk') { if (talk.shown < talk.text.length) talk.shown = talk.text.length; else nextStep(); }
  else if (S === 'over') { credits++; score = 0; nextExtend = 30000; Object.assign(P, { lives: 3, bombs: 2, alive: true, inv: 3, x: W / 2, y: H - 46, overT: 0 }); S = 'play'; playMusic(stg.phase === 'boss' ? (stg.n === 3 ? 'nader' : 'boss') : 'stage'); }
  else if (S === 'win') { stg = null; toTitle(); }
  else if (S === 'play' && paused) setPaused(false);
}
function setPaused(v) {
  paused = v;
  if (AU.ctx) { if (v) AU.ctx.suspend().catch(() => {}); else AU.ctx.resume().catch(() => {}); }
}
let drag = null;
stageEl.addEventListener('pointerdown', e => {
  if (e.target.closest && e.target.closest('.btn')) return;
  e.preventDefault(); audioInit();
  if (S === 'play' && !paused) { drag = { id: e.pointerId, px: e.clientX, py: e.clientY }; try { stageEl.setPointerCapture(e.pointerId); } catch (_) {} }
  else tap();
});
stageEl.addEventListener('pointermove', e => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = (e.clientX - drag.px) / scale * 1.3, dy = (e.clientY - drag.py) / scale * 1.3;
  drag.px = e.clientX; drag.py = e.clientY;
  if (S === 'play' && !paused && P.alive) { P.x = clamp(P.x + dx, 6, W - 6); P.y = clamp(P.y + dy, 22, H - 10); }
});
const endDrag = e => { if (drag && e.pointerId === drag.id) drag = null; };
stageEl.addEventListener('pointerup', endDrag); stageEl.addEventListener('pointercancel', endDrag);
stageEl.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
stageEl.addEventListener('contextmenu', e => e.preventDefault());
bombBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); audioInit(); doBomb(); });
pauseBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (S === 'play') setPaused(!paused); });
muteBtn.addEventListener('pointerdown', e => {
  e.preventDefault(); e.stopPropagation(); audioInit();
  AU.muted = !AU.muted; muteBtn.setAttribute('aria-pressed', String(AU.muted));
  if (AU.master) AU.master.gain.value = AU.muted ? 0 : 0.8;
});
addEventListener('keydown', e => {
  keys[e.code] = true; audioInit();
  if (e.code === 'Space' || e.code === 'KeyX') { e.preventDefault(); if (S === 'play') doBomb(); else tap(); }
  else if (e.code === 'Enter' || e.code === 'KeyZ') tap();
  else if (e.code === 'KeyP' || e.code === 'Escape') { if (S === 'play') setPaused(!paused); }
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
// iOS only unlocks audio on touchend/click, not on touchstart/pointerdown.
function unlockAudio() {
  audioInit();
  const a = AU.ctx; if (!a) return;
  if (a.state !== 'running' && !paused) a.resume().catch(() => {});
  try { const src = a.createBufferSource(); src.buffer = a.createBuffer(1, 1, 22050); src.connect(a.destination); src.start(0); } catch (e) {}
}
['touchend', 'click', 'pointerup', 'keydown'].forEach(ev => document.addEventListener(ev, unlockAudio, { capture: true, passive: true }));
document.addEventListener('visibilitychange', () => { if (document.hidden && S === 'play' && !paused) setPaused(true); });

// ------------------------------------------------------------------ loop
let last = performance.now();
function frame(now) {
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
playMusic('title');
requestAnimationFrame(frame);
window.__hw = { get S() { return S; }, get audio() { return AU.ctx ? AU.ctx.state : "none"; }, startStage: n => { if (!P) P = newPlayer(); startStage(n); }, skipTo: (n) => { if (!P) P = newPlayer(); startStage(n); stg.t = stg.len; } };
})();
</script>
